<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>江西云信产品新春发展大屏战报</title>
  <style>
    :root {
      --red-deep: #320006;
      --red-main: #8f0711;
      --red-bright: #d4211f;
      --gold: #ffd36a;
      --gold-soft: #ffecae;
      --orange: #ff8a24;
      --panel: rgba(85, 4, 10, 0.72);
      --panel-strong: rgba(112, 9, 13, 0.82);
      --line: rgba(255, 211, 106, 0.62);
      --text: #fff5d7;
      --muted: rgba(255, 236, 174, 0.74);
      --shadow: rgba(255, 195, 74, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 193, 78, 0.22) 0, rgba(255, 193, 78, 0) 32%),
        linear-gradient(135deg, #420006 0%, #8c0711 42%, #5e0209 68%, #220004 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 226, 150, 0.88) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 148, 70, 0.44) 0 1px, transparent 1.5px);
      background-size: 108px 108px, 166px 166px;
      background-position: 18px 22px, 80px 52px;
      opacity: 0.32;
      animation: starDrift 18s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 211, 106, 0) 0, rgba(255, 211, 106, 0.18) 50%, rgba(255, 211, 106, 0) 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 110px);
      mix-blend-mode: screen;
      opacity: 0.2;
    }

    .fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .screen {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 22px 30px 18px;
      overflow: hidden;
    }

    .decor-lantern {
      position: absolute;
      top: 18px;
      width: 70px;
      height: 94px;
      pointer-events: none;
      filter: drop-shadow(0 0 18px rgba(255, 196, 74, 0.42));
      animation: lanternFloat 4.8s ease-in-out infinite;
    }

    .decor-lantern.left {
      left: 42px;
    }

    .decor-lantern.right {
      right: 42px;
      animation-delay: 0.9s;
    }

    .decor-lantern::before {
      content: "";
      position: absolute;
      left: 22px;
      top: -12px;
      width: 26px;
      height: 20px;
      border-top: 2px solid rgba(255, 229, 158, 0.86);
      border-left: 2px solid rgba(255, 229, 158, 0.3);
      border-right: 2px solid rgba(255, 229, 158, 0.3);
      border-radius: 50% 50% 0 0;
    }

    .lantern-body {
      position: absolute;
      inset: 8px 10px 22px;
      border: 2px solid rgba(255, 218, 115, 0.9);
      border-radius: 48% / 36%;
      background:
        linear-gradient(90deg, rgba(255, 224, 135, 0.22), transparent 18%, transparent 82%, rgba(255, 224, 135, 0.22)),
        radial-gradient(circle at 50% 28%, #ff5b3b 0, #d61e1b 34%, #8a0710 100%);
    }

    .lantern-body::before,
    .lantern-body::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .lantern-body::before {
      top: 7px;
    }

    .lantern-body::after {
      bottom: 7px;
    }

    .lantern-tail {
      position: absolute;
      left: 33px;
      bottom: 0;
      width: 4px;
      height: 24px;
      border-radius: 999px;
      background: linear-gradient(var(--gold), #ff4c1a);
    }

    .lantern-tail::before {
      content: "";
      position: absolute;
      left: -10px;
      bottom: -11px;
      width: 24px;
      height: 14px;
      border-radius: 0 0 16px 16px;
      background: linear-gradient(90deg, #ffbc41, #ff5f1c, #ffbc41);
    }

    .cloud {
      position: absolute;
      pointer-events: none;
      width: 240px;
      height: 72px;
      border-top: 2px solid rgba(255, 217, 126, 0.28);
      border-bottom: 2px solid rgba(255, 217, 126, 0.14);
      opacity: 0.72;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border: 2px solid rgba(255, 217, 126, 0.24);
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 38px 0 0;
    }

    .cloud::before {
      left: 28px;
      top: 15px;
      width: 88px;
      height: 36px;
    }

    .cloud::after {
      right: 18px;
      top: 26px;
      width: 118px;
      height: 30px;
    }

    .cloud.one {
      left: 110px;
      bottom: 72px;
    }

    .cloud.two {
      right: 140px;
      top: 126px;
      transform: scaleX(-1);
    }

    .header {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 86px;
      padding: 4px 94px 8px;
    }

    .title-wrap {
      grid-column: 2;
      text-align: center;
    }

    .board-title {
      margin: 0;
      font-size: 48px;
      line-height: 1.08;
      font-weight: 800;
      color: var(--gold-soft);
      text-shadow:
        0 0 8px rgba(255, 224, 139, 0.82),
        0 0 26px rgba(255, 161, 39, 0.54),
        0 3px 0 rgba(95, 11, 0, 0.72);
      animation: titleGlow 2.8s ease-in-out infinite;
    }

    .title-subline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 16px;
      color: rgba(255, 236, 174, 0.78);
    }

    .title-subline::before,
    .title-subline::after {
      content: "";
      width: 122px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .header-mark {
      justify-self: start;
      padding-left: 18px;
      border-left: 3px solid rgba(255, 211, 106, 0.78);
      color: rgba(255, 236, 174, 0.74);
      font-size: 18px;
      font-weight: 700;
    }

    .clock-box {
      justify-self: end;
      min-width: 280px;
      padding-left: 18px;
      border-left: 1px solid rgba(255, 211, 106, 0.48);
      text-align: right;
    }

    .current-date {
      color: rgba(255, 236, 174, 0.68);
      font-size: 14px;
    }

    .current-clock {
      margin-top: 2px;
      color: var(--gold-soft);
      font-family: "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 14px rgba(255, 197, 67, 0.38);
    }

    .content {
      display: grid;
      flex: 1;
      min-height: 0;
      grid-template-columns: minmax(500px, 34%) minmax(0, 1fr);
      gap: 20px;
    }

    .panel,
    .metric-card,
    .hero-panel,
    .trend-panel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(118, 10, 14, 0.78), rgba(61, 0, 7, 0.72)),
        radial-gradient(circle at 50% 0%, rgba(255, 211, 106, 0.2), transparent 48%);
      box-shadow:
        inset 0 0 22px rgba(255, 215, 111, 0.12),
        0 0 24px rgba(98, 0, 8, 0.38),
        0 0 20px rgba(255, 176, 47, 0.08);
      overflow: hidden;
    }

    .panel::before,
    .metric-card::before,
    .hero-panel::before,
    .trend-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent, rgba(255, 233, 165, 0.18), transparent);
      transform: translateX(-120%);
      animation: panelShine 5.8s ease-in-out infinite;
    }

    .rank-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 18px 16px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel-title h2 {
      margin: 0;
      color: var(--gold-soft);
      font-size: 24px;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 199, 78, 0.42);
    }

    .panel-title span {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .rank-list {
      display: grid;
      grid-template-rows: repeat(11, minmax(0, 1fr));
      flex: 1;
      min-height: 0;
      gap: 8px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 42px minmax(56px, 74px) minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      min-height: 0;
      padding: 8px 10px;
      border: 1px solid rgba(255, 211, 106, 0.18);
      border-radius: 8px;
      background: linear-gradient(90deg, rgba(255, 211, 106, 0.09), rgba(255, 255, 255, 0.03));
      transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .rank-row.top {
      border-color: rgba(255, 221, 126, 0.52);
      background: linear-gradient(90deg, rgba(255, 204, 78, 0.17), rgba(255, 81, 33, 0.08));
    }

    .rank-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 211, 106, 0.48);
      border-radius: 50%;
      background: rgba(61, 0, 7, 0.62);
      color: var(--gold-soft);
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(255, 180, 48, 0.16);
    }

    .rank-row.top .rank-badge {
      background: linear-gradient(145deg, #fff0aa, #ff9b31 58%, #b31610);
      color: #5d0800;
      box-shadow: 0 0 18px rgba(255, 197, 65, 0.44);
    }

    .city-name {
      overflow: hidden;
      color: #fff4d2;
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .city-progress-wrap {
      min-width: 0;
    }

    .city-values {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
      color: rgba(255, 236, 174, 0.72);
    }

    .city-current {
      color: var(--gold-soft);
      font-size: 18px;
      font-weight: 800;
    }

    .city-income {
      color: rgba(255, 236, 174, 0.68);
      font-size: 12px;
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff6b22, #ffcb52, #fff1a8);
      box-shadow: 0 0 14px rgba(255, 192, 65, 0.56);
      transition: width 0.9s ease;
    }

    .stage {
      display: grid;
      min-height: 0;
      grid-template-rows: auto auto minmax(230px, 1fr);
      gap: 16px;
    }

    .hero-panel {
      padding: 22px 30px;
    }

    .today-summary {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) 1px minmax(270px, 0.8fr);
      align-items: center;
      min-height: 226px;
    }

    .summary-main {
      position: relative;
      min-width: 0;
      text-align: center;
    }

    .summary-divider {
      width: 1px;
      height: 72%;
      background: linear-gradient(transparent, rgba(255, 220, 125, 0.62), transparent);
    }

    .revenue-block {
      min-width: 0;
      padding-left: 34px;
      text-align: left;
    }

    .hero-label {
      color: rgba(255, 236, 174, 0.84);
      font-size: 22px;
      font-weight: 700;
    }

    .total-number {
      margin-top: 8px;
      color: #fff7cc;
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 112px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow:
        0 0 8px rgba(255, 244, 190, 0.96),
        0 0 26px rgba(255, 192, 57, 0.82),
        0 0 52px rgba(255, 81, 33, 0.42);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .summary-unit {
      margin-top: 3px;
      color: rgba(255, 236, 174, 0.62);
      font-size: 14px;
    }

    .revenue-label {
      color: rgba(255, 236, 174, 0.76);
      font-size: 18px;
      font-weight: 700;
    }

    .revenue-value {
      margin-top: 12px;
      color: var(--gold-soft);
      font-family: "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 46px;
      line-height: 1.08;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(255, 190, 63, 0.44);
    }

    .revenue-note {
      margin-top: 12px;
      color: rgba(255, 236, 174, 0.56);
      font-size: 13px;
    }

    .total-number.pulse {
      animation: numberPulse 0.72s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .metric-card {
      min-height: 122px;
      padding: 18px 18px 16px;
    }

    .metric-label {
      color: rgba(255, 236, 174, 0.75);
      font-size: 16px;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 12px;
      color: var(--gold-soft);
      font-size: 32px;
      line-height: 1.1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(255, 190, 63, 0.42);
      word-break: keep-all;
    }

    .metric-value.city-leader {
      font-size: 30px;
    }

    .metric-note {
      margin-top: 10px;
      color: rgba(255, 236, 174, 0.58);
      font-size: 12px;
      white-space: nowrap;
    }

    .trend-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 18px 20px 16px;
    }

    .trend-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .trend-head h2 {
      margin: 0;
      color: var(--gold-soft);
      font-size: 24px;
      font-weight: 800;
    }

    .trend-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255, 236, 174, 0.72);
      font-size: 13px;
      white-space: nowrap;
    }

    .legend-line {
      display: inline-block;
      width: 34px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff7a24, #ffe69c);
      box-shadow: 0 0 12px rgba(255, 207, 85, 0.58);
      vertical-align: middle;
    }

    .trend-canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    #trendChart {
      display: block;
      width: 100%;
      height: 100%;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding-top: 13px;
      color: rgba(255, 236, 174, 0.68);
      font-size: 14px;
      text-align: center;
      flex-wrap: wrap;
    }

    .footer strong {
      color: var(--gold-soft);
      font-weight: 700;
    }

    @keyframes titleGlow {
      0%,
      100% {
        filter: brightness(1);
      }
      50% {
        filter: brightness(1.16);
      }
    }

    @keyframes numberPulse {
      0% {
        transform: scale(1);
      }
      44% {
        transform: scale(1.018);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes lanternFloat {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(8px);
      }
    }

    @keyframes starDrift {
      from {
        background-position: 18px 22px, 80px 52px;
      }
      to {
        background-position: 126px 130px, 246px 218px;
      }
    }

    @keyframes panelShine {
      0%,
      72% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(120%);
      }
    }

    @media (min-width: 1281px) and (max-width: 1500px),
      (min-width: 1281px) and (max-height: 850px) {
      .screen {
        padding: 12px 18px 10px;
      }

      .decor-lantern {
        top: 12px;
        width: 58px;
        height: 78px;
      }

      .decor-lantern.left {
        left: 26px;
      }

      .decor-lantern.right {
        right: 26px;
      }

      .header {
        min-height: 70px;
        padding: 2px 72px 6px;
      }

      .board-title {
        font-size: 38px;
      }

      .title-subline {
        gap: 10px;
        margin-top: 4px;
        font-size: 13px;
      }

      .title-subline::before,
      .title-subline::after {
        width: 84px;
      }

      .header-mark {
        padding-left: 12px;
        font-size: 14px;
      }

      .clock-box {
        min-width: 236px;
        padding-left: 12px;
      }

      .current-date {
        font-size: 11px;
      }

      .current-clock {
        font-size: 22px;
      }

      .content {
        grid-template-columns: minmax(440px, 35%) minmax(0, 1fr);
        gap: 14px;
      }

      .rank-panel {
        padding: 10px 12px;
      }

      .panel-title {
        margin-bottom: 8px;
      }

      .panel-title h2,
      .trend-head h2 {
        font-size: 20px;
      }

      .panel-title span {
        font-size: 12px;
      }

      .rank-list {
        gap: 5px;
      }

      .rank-row {
        grid-template-columns: 32px 56px minmax(0, 1fr);
        gap: 6px;
        padding: 3px 6px;
      }

      .rank-badge {
        width: 26px;
        height: 26px;
        font-size: 12px;
      }

      .city-name {
        font-size: 16px;
      }

      .city-values {
        margin-bottom: 2px;
        font-size: 10px;
      }

      .city-current {
        font-size: 15px;
      }

      .city-income {
        font-size: 9px;
      }

      .progress-track {
        height: 6px;
      }

      .stage {
        grid-template-rows: auto auto minmax(180px, 1fr);
        gap: 10px;
      }

      .hero-panel {
        padding: 12px 20px 10px;
      }

      .today-summary {
        grid-template-columns: minmax(0, 1.35fr) 1px minmax(220px, 0.75fr);
        min-height: 158px;
      }

      .hero-label {
        font-size: 18px;
      }

      .total-number {
        margin-top: 4px;
        font-size: 76px;
      }

      .revenue-block {
        padding-left: 22px;
      }

      .revenue-label {
        font-size: 14px;
      }

      .revenue-value {
        margin-top: 8px;
        font-size: 34px;
      }

      .revenue-note {
        margin-top: 8px;
        font-size: 10px;
      }

      .metrics {
        gap: 10px;
      }

      .metric-card {
        min-height: 96px;
        padding: 12px;
      }

      .metric-label {
        font-size: 13px;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 24px;
      }

      .metric-value.city-leader {
        font-size: 22px;
      }

      .metric-note {
        margin-top: 6px;
        font-size: 10px;
      }

      .trend-panel {
        padding: 12px 14px 10px;
      }

      .trend-head {
        margin-bottom: 8px;
      }

      .trend-legend {
        font-size: 11px;
      }

    }

    @media (max-width: 1280px) {
      body {
        overflow: auto;
      }

      .screen {
        height: auto;
        min-height: 100vh;
        overflow: visible;
        padding: 18px;
      }

      .header {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 8px 72px;
      }

      .header-mark,
      .title-wrap,
      .clock-box {
        grid-column: 1;
      }

      .header-mark {
        justify-self: center;
      }

      .clock-box {
        justify-self: center;
        padding: 8px 0 0;
        border-left: 0;
        border-top: 1px solid rgba(255, 211, 106, 0.34);
        text-align: center;
      }

      .content {
        grid-template-columns: 1fr;
      }

      .rank-list {
        grid-template-rows: none;
      }

      .rank-row {
        min-height: 62px;
      }

      .total-number {
        font-size: 82px;
      }
    }

    @media (max-width: 820px) {
      .decor-lantern,
      .cloud {
        display: none;
      }

      .screen {
        padding: 14px;
      }

      .header {
        padding: 4px 0 10px;
      }

      .board-title {
        font-size: 34px;
      }

      .title-subline::before,
      .title-subline::after {
        width: 58px;
      }

      .clock-box {
        min-width: 0;
        width: 100%;
      }

      .hero-panel {
        padding: 22px 14px;
      }

      .today-summary {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .summary-divider {
        width: 100%;
        height: 1px;
      }

      .revenue-block {
        padding-left: 0;
        text-align: center;
      }

      .total-number {
        font-size: 48px;
        white-space: normal;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 24px;
      }

      .rank-row {
        grid-template-columns: 36px 54px minmax(0, 1fr);
      }

      .trend-head {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
  <style id="leadership-layout">
    .screen {
      padding: 16px 26px 18px;
    }

    .header {
      grid-template-columns: 260px minmax(0, 1fr) 260px;
      min-height: 82px;
      padding: 0 92px 8px;
    }

    .year-badge {
      justify-self: start;
      margin-left: 26px;
      padding: 8px 18px;
      border: 1px solid rgba(255, 218, 115, 0.64);
      border-radius: 4px;
      color: var(--gold-soft);
      background: linear-gradient(135deg, rgba(255, 213, 102, 0.14), rgba(114, 5, 10, 0.46));
      box-shadow: inset 0 0 14px rgba(255, 220, 127, 0.08), 0 0 18px rgba(255, 179, 45, 0.12);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .board-title {
      font-size: 44px;
    }

    .title-wrap {
      grid-column: 2;
    }

    .clock-box {
      grid-column: 3;
      margin-right: 24px;
    }

    .dashboard-content {
      display: grid;
      flex: 1;
      min-height: 0;
      grid-template-rows: 210px 130px minmax(0, 1fr);
      gap: 12px;
    }

    .overview-panel,
    .today-panel {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border-top: 1px solid rgba(255, 218, 115, 0.7);
      border-bottom: 1px solid rgba(255, 218, 115, 0.48);
      background:
        linear-gradient(90deg, rgba(89, 2, 8, 0.3), rgba(132, 10, 13, 0.78) 26%, rgba(132, 10, 13, 0.78) 74%, rgba(89, 2, 8, 0.3)),
        radial-gradient(circle at 50% 10%, rgba(255, 214, 111, 0.18), transparent 56%);
      box-shadow: inset 0 0 24px rgba(255, 215, 111, 0.08), 0 0 22px rgba(69, 0, 6, 0.36);
    }

    .overview-panel::before,
    .today-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255, 234, 168, 0.13), transparent);
      transform: translateX(-120%);
      animation: panelShine 6.8s ease-in-out infinite;
    }

    .overview-panel {
      padding: 13px 26px 17px;
    }

    .today-panel {
      padding: 10px 26px 12px;
    }

    .section-head {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      gap: 18px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--gold-soft);
      font-size: 20px;
      font-weight: 800;
      text-shadow: 0 0 12px rgba(255, 199, 78, 0.36);
    }

    .section-head span {
      color: rgba(255, 236, 174, 0.68);
      font-size: 13px;
      white-space: nowrap;
    }

    .overview-grid,
    .today-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
      align-items: center;
      height: calc(100% - 28px);
    }

    .overview-metric,
    .today-metric {
      min-width: 0;
      text-align: center;
    }

    .overview-label {
      color: rgba(255, 239, 190, 0.84);
      font-size: 18px;
      font-weight: 700;
    }

    .overview-value {
      margin-top: 3px;
      color: #fff7cc;
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 70px;
      line-height: 1.04;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(255, 244, 190, 0.9), 0 0 26px rgba(255, 192, 57, 0.72), 0 0 44px rgba(255, 81, 33, 0.34);
    }

    .overview-value.pulse,
    .today-value.pulse {
      animation: numberPulse 0.72s ease;
    }

    .overview-unit,
    .today-unit {
      margin-top: 2px;
      color: rgba(255, 236, 174, 0.58);
      font-size: 12px;
    }

    .overview-divider,
    .today-divider {
      justify-self: center;
      width: 1px;
      height: 72%;
      background: linear-gradient(transparent, rgba(255, 220, 125, 0.66), transparent);
    }

    .today-label {
      display: inline-block;
      margin-right: 18px;
      color: rgba(255, 239, 190, 0.82);
      font-size: 17px;
      font-weight: 700;
      vertical-align: baseline;
    }

    .today-value {
      display: inline-block;
      color: var(--gold-soft);
      font-family: "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 44px;
      line-height: 1.05;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      vertical-align: baseline;
      text-shadow: 0 0 20px rgba(255, 190, 63, 0.5);
    }

    .today-unit {
      display: inline-block;
      margin-left: 10px;
      white-space: nowrap;
    }

    .horse-watermark {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 54%;
      width: 315px;
      max-height: 188px;
      object-fit: contain;
      transform: translate(-50%, -50%);
      opacity: 0.13;
      filter: saturate(1.08) drop-shadow(0 0 20px rgba(255, 208, 86, 0.34));
      pointer-events: none;
    }

    .ranking-columns {
      display: grid;
      min-height: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .ranking-columns .rank-panel {
      padding: 11px 13px 10px;
    }

    .ranking-columns .panel-title {
      min-height: 28px;
      margin-bottom: 7px;
    }

    .ranking-columns .panel-title h2 {
      font-size: 20px;
    }

    .ranking-columns .panel-title span {
      font-size: 12px;
    }

    .ranking-columns .rank-list {
      gap: 5px;
    }

    .ranking-columns .rank-row {
      grid-template-columns: 30px 48px minmax(0, 1fr);
      gap: 8px;
      padding: 4px 8px;
      border-radius: 5px;
    }

    .ranking-columns .rank-badge {
      width: 24px;
      height: 24px;
      font-size: 11px;
    }

    .ranking-columns .city-name {
      font-size: 15px;
    }

    .ranking-columns .city-values {
      margin-bottom: 3px;
    }

    .ranking-columns .city-current {
      font-size: 14px;
    }

    .ranking-columns .city-income {
      font-size: 11px;
    }

    .ranking-columns .progress-track {
      height: 5px;
    }

    @media (min-width: 901px) and (max-width: 1500px),
      (min-width: 901px) and (max-height: 850px) {
      body {
        overflow: hidden;
      }

      .screen {
        height: 100vh;
        min-height: 0;
        padding: 10px 14px 12px;
        overflow: hidden;
      }

      .header {
        grid-template-columns: 210px minmax(0, 1fr) 210px;
        min-height: 62px;
        padding: 0 66px 6px;
      }

      .year-badge {
        grid-column: 1;
        margin-left: 18px;
        padding: 5px 11px;
        font-size: 13px;
      }

      .title-wrap {
        grid-column: 2;
      }

      .board-title {
        font-size: 36px;
      }

      .clock-box {
        grid-column: 3;
        min-width: 200px;
        margin-right: 18px;
        padding-left: 10px;
      }

      .current-date {
        font-size: 10px;
      }

      .current-clock {
        font-size: 21px;
      }

      .dashboard-content {
        grid-template-rows: 140px 90px minmax(0, 1fr);
        gap: 8px;
      }

      .overview-panel {
        padding: 7px 18px 9px;
      }

      .today-panel {
        padding: 5px 18px 7px;
      }

      .section-head {
        min-height: 21px;
      }

      .section-head h2 {
        font-size: 15px;
      }

      .section-head span {
        font-size: 10px;
      }

      .overview-grid,
      .today-grid {
        height: calc(100% - 21px);
      }

      .overview-label,
      .today-label {
        font-size: 13px;
      }

      .overview-value {
        font-size: 46px;
      }

      .today-value {
        font-size: 30px;
      }

      .today-label {
        margin-right: 10px;
      }

      .overview-unit,
      .today-unit {
        font-size: 9px;
      }

      .horse-watermark {
        width: 230px;
        max-height: 120px;
      }

      .ranking-columns {
        gap: 8px;
      }

      .ranking-columns .rank-panel {
        padding: 7px 9px 7px;
      }

      .ranking-columns .panel-title {
        min-height: 21px;
        margin-bottom: 5px;
      }

      .ranking-columns .panel-title h2 {
        font-size: 16px;
      }

      .ranking-columns .panel-title span {
        font-size: 9px;
      }

      .ranking-columns .rank-list {
        grid-template-rows: repeat(11, minmax(0, 1fr));
        gap: 3px;
      }

      .ranking-columns .rank-row {
        grid-template-columns: 23px 40px minmax(0, 1fr);
        gap: 5px;
        min-height: 0;
        padding: 2px 5px;
      }

      .ranking-columns .rank-badge {
        width: 20px;
        height: 20px;
        font-size: 9px;
      }

      .ranking-columns .city-name {
        font-size: 12px;
      }

      .ranking-columns .city-values {
        margin-bottom: 1px;
      }

      .ranking-columns .city-current {
        font-size: 11px;
      }

      .ranking-columns .city-income {
        font-size: 9px;
      }

      .ranking-columns .progress-track {
        height: 4px;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .screen {
        width: 100%;
        height: auto;
        min-height: 100vh;
        padding: 12px;
        overflow: visible;
      }

      .header {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 4px 0 12px;
      }

      .year-badge,
      .title-wrap,
      .clock-box {
        grid-column: 1;
        justify-self: center;
        margin-left: 0;
        margin-right: 0;
      }

      .board-title {
        font-size: 30px;
        text-align: center;
      }

      .clock-box {
        min-width: 0;
        padding: 6px 0 0;
        border-top: 1px solid rgba(255, 211, 106, 0.34);
        border-left: 0;
        text-align: center;
      }

      .dashboard-content {
        grid-template-rows: auto auto auto;
      }

      .overview-panel,
      .today-panel {
        min-height: 250px;
      }

      .overview-grid,
      .today-grid {
        grid-template-columns: 1fr;
        height: auto;
        gap: 18px;
        padding: 20px 0;
      }

      .overview-divider,
      .today-divider {
        width: 70%;
        height: 1px;
      }

      .overview-value {
        font-size: 42px;
        white-space: normal;
      }

      .today-value {
        font-size: 32px;
        white-space: normal;
      }

      .ranking-columns {
        grid-template-columns: 1fr;
      }

      .ranking-columns .rank-row {
        min-height: 48px;
      }
    }
  </style>
</head>

  <script>
    const refs = {
      boardTitle: document.getElementById("boardTitle"),
      currentDate: document.getElementById("currentDate"),
      currentTime: document.getElementById("currentTime"),
      summaryRange: document.getElementById("summaryRange"),
      todayDate: document.getElementById("todayDate"),
      cumulativeTotal: document.getElementById("cumulativeTotal"),
      cumulativeRevenue: document.getElementById("cumulativeRevenue"),
      todayTotal: document.getElementById("todayTotal"),
      todayRevenue: document.getElementById("todayRevenue"),
      cumulativeRankRange: document.getElementById("cumulativeRankRange"),
      todayRankList: document.getElementById("todayRankList"),
      cumulativeRankList: document.getElementById("cumulativeRankList"),
      fireworks: document.getElementById("fireworks")
    };

    const numberFormatter = new Intl.NumberFormat("zh-CN");
    const animatedValues = new Map();
    const rankRows = {
      today: new Map(),
      cumulative: new Map()
    };

    let latestSnapshot = null;
    let resizeTimer = null;
    let lastRenderedCumulative = null;
    let lastRenderedToday = null;

    const DAY_MS = 24 * 60 * 60 * 1000;
    const previewParams = new URLSearchParams(window.location.search);
    const previewStartedAt = Date.now();
    const sourceDays = CONFIG.dailyData.map((row) => ({
      date: row[0],
      values: row.slice(1).map((value) => Math.max(0, Number(value) || 0))
    }));
    const cityPrefixByDay = [CONFIG.cityNames.map(() => 0)];
    sourceDays.forEach((day) => {
      const previous = cityPrefixByDay[cityPrefixByDay.length - 1];
      cityPrefixByDay.push(previous.map((value, cityIndex) => value + day.values[cityIndex]));
    });
    const scheduleCache = new Map();

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function parseDateKey(value) {
      const parts = String(value).split("-").map(Number);
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function addDays(date, amount) {
      const result = new Date(date);
      result.setDate(result.getDate() + amount);
      return result;
    }

    function calendarDayDifference(later, earlier) {
      const laterUtc = Date.UTC(later.getFullYear(), later.getMonth(), later.getDate());
      const earlierUtc = Date.UTC(earlier.getFullYear(), earlier.getMonth(), earlier.getDate());
      return Math.round((laterUtc - earlierUtc) / DAY_MS);
    }

    function getCampaignStartDay() {
      return parseDateKey(CONFIG.campaignStartDate || sourceDays[0].date);
    }

    function getLiveDayIndex(date) {
      return calendarDayDifference(startOfDay(date), getCampaignStartDay());
    }

    function getDataDayIndex(date) {
      const liveDayIndex = getLiveDayIndex(date);
      if (liveDayIndex < 0) {
        return 0;
      }
      return clamp(liveDayIndex, 0, sourceDays.length - 1);
    }

    function getDisplayNow() {
      if (previewParams.get("preview") !== "1") {
        return new Date();
      }

      const requestedDay = Number(previewParams.get("day"));
      const dayIndex = clamp(Number.isFinite(requestedDay) ? requestedDay : 0, 0, sourceDays.length - 1);
      const cycleMs = 6 * 60 * 1000;
      const ratio = ((Date.now() - previewStartedAt) % cycleMs) / cycleMs;
      const date = addDays(getCampaignStartDay(), dayIndex);
      date.setHours(Number(CONFIG.dailyStartHour) || 8, 0, 0, 0);
      date.setTime(date.getTime() + ratio * getDailyDurationMs());
      return date;
    }

    function formatNumber(value) {
      return numberFormatter.format(Math.max(0, Math.round(value)));
    }

    function formatCurrency(value) {
      return `¥${Math.max(0, Number(value) || 0).toLocaleString("zh-CN", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function formatClock(date) {
      const pad = (num) => String(num).padStart(2, "0");
      return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function formatCurrentDate(date) {
      const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      return `${date.getFullYear()}年${String(date.getMonth() + 1).padStart(2, "0")}月${String(date.getDate()).padStart(2, "0")}日 ${weekdays[date.getDay()]}`;
    }

    function formatDateShort(date) {
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}.${String(date.getDate()).padStart(2, "0")}`;
    }

    function formatDateChinese(date) {
      return `${date.getFullYear()}年${String(date.getMonth() + 1).padStart(2, "0")}月${String(date.getDate()).padStart(2, "0")}日`;
    }

    function getDailyDurationMs() {
      const startHour = Number(CONFIG.dailyStartHour) || 8;
      const endHour = Number(CONFIG.dailyEndHour) || 20;
      return Math.max(1, endHour - startHour) * 60 * 60 * 1000;
    }

    function hashString(value) {
      let hash = 2166136261;
      for (let index = 0; index < value.length; index += 1) {
        hash ^= value.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return hash >>> 0;
    }

    function createRandom(seed) {
      let value = seed >>> 0;
      return function random() {
        value += 0x6d2b79f5;
        let result = value;
        result = Math.imul(result ^ (result >>> 15), result | 1);
        result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
        return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
      };
    }

    function buildMinuteSchedule(dayIndex, cityIndex) {
      const cacheKey = `${dayIndex}-${cityIndex}`;
      if (scheduleCache.has(cacheKey)) {
        return scheduleCache.get(cacheKey);
      }

      const amount = sourceDays[dayIndex].values[cityIndex];
      const totalMinutes = Math.max(1, (Number(CONFIG.dailyEndHour) - Number(CONFIG.dailyStartHour)) * 60);
      const seed = hashString(`${sourceDays[dayIndex].date}|${CONFIG.cityNames[cityIndex]}`);
      const random = createRandom(seed);
      const hourProfile = [0.42, 0.76, 1.04, 1.20, 0.70, 0.62, 1.08, 1.28, 1.22, 1.00, 0.72, 0.44];
      const cityShiftMinutes = Math.round((random() - 0.5) * 46);
      const weights = [];

      for (let minute = 0; minute < totalMinutes; minute += 1) {
        const shiftedMinute = clamp(minute + cityShiftMinutes, 0, totalMinutes - 1);
        const profileIndex = clamp(Math.floor(shiftedMinute / 60), 0, hourProfile.length - 1);
        const minuteNoise = 0.50 + random() * 1.02;
        const quietFactor = random() < 0.10 ? 0.16 : 1;
        const broadWave = 0.90 + 0.10 * Math.sin(Math.PI * minute / Math.max(1, totalMinutes - 1));
        weights.push(hourProfile[profileIndex] * minuteNoise * quietFactor * broadWave);
      }

      const weightTotal = weights.reduce((sum, value) => sum + value, 0);
      const quotas = [];
      let carry = 0;
      let assigned = 0;

      weights.forEach((weight) => {
        const exact = amount * weight / Math.max(1, weightTotal) + carry;
        const quota = Math.floor(exact);
        carry = exact - quota;
        quotas.push(quota);
        assigned += quota;
      });

      quotas[quotas.length - 1] += amount - assigned;
      const prefix = [0];
      quotas.forEach((quota) => prefix.push(prefix[prefix.length - 1] + quota));

      const schedule = { quotas, prefix, seed };
      scheduleCache.set(cacheKey, schedule);
      return schedule;
    }

    function getMinuteReleased(quota, second, seed) {
      if (quota <= 0) {
        return 0;
      }

      const random = createRandom(seed);
      const burstCount = quota >= 500 ? 4 : quota >= 80 ? 3 : quota >= 8 ? 2 : 1;
      const offsets = [];
      const weights = [];

      for (let index = 0; index < burstCount; index += 1) {
        const slot = (index + 1) * 60 / (burstCount + 1);
        offsets.push(clamp(Math.round(slot + (random() - 0.5) * 10), 2, 58));
        weights.push(0.65 + random() * 0.70);
      }

      const weightTotal = weights.reduce((sum, value) => sum + value, 0);
      const chunks = [];
      let assigned = 0;
      let carry = 0;

      weights.forEach((weight) => {
        const exact = quota * weight / weightTotal + carry;
        const chunk = Math.floor(exact);
        carry = exact - chunk;
        chunks.push(chunk);
        assigned += chunk;
      });
      chunks[chunks.length - 1] += quota - assigned;

      return chunks.reduce((sum, chunk, index) => (
        second >= offsets[index] ? sum + chunk : sum
      ), 0);
    }

    function getDayReleased(dayIndex, cityIndex, date) {
      const amount = sourceDays[dayIndex].values[cityIndex];
      const startHour = Number(CONFIG.dailyStartHour) || 8;
      const endHour = Number(CONFIG.dailyEndHour) || 20;
      const secondsOfDay = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds();
      const startSeconds = startHour * 3600;
      const endSeconds = endHour * 3600;

      if (secondsOfDay < startSeconds) {
        return 0;
      }
      if (secondsOfDay >= endSeconds) {
        return amount;
      }

      const elapsedSeconds = secondsOfDay - startSeconds;
      const minuteIndex = Math.floor(elapsedSeconds / 60);
      const second = elapsedSeconds % 60;
      const schedule = buildMinuteSchedule(dayIndex, cityIndex);
      const minuteQuota = schedule.quotas[minuteIndex] || 0;
      const minuteSeed = hashString(`${schedule.seed}|${minuteIndex}`);
      return schedule.prefix[minuteIndex] + getMinuteReleased(minuteQuota, second, minuteSeed);
    }

    function getTodayTotalAt(dayIndex, date) {
      return CONFIG.cityNames.reduce((sum, _, cityIndex) => (
        sum + getDayReleased(dayIndex, cityIndex, date)
      ), 0);
    }

    function getSnapshot(date) {
      const liveDayIndex = getLiveDayIndex(date);
      const dayIndex = getDataDayIndex(date);
      const unitPrice = Math.max(0, Number(CONFIG.unitPrice) || 0);
      const hasCurrentDay = liveDayIndex >= 0 && liveDayIndex < sourceDays.length;
      const completedDayCount = liveDayIndex < 0 ? 0 : Math.min(liveDayIndex, sourceDays.length);
      const completedValues = cityPrefixByDay[completedDayCount];
      const todayCities = CONFIG.cityNames.map((name, cityIndex) => {
        const current = hasCurrentDay ? getDayReleased(dayIndex, cityIndex, date) : 0;
        return {
          name,
          current,
          income: current * unitPrice
        };
      });
      const cumulativeCities = CONFIG.cityNames.map((name, cityIndex) => {
        const current = completedValues[cityIndex] + todayCities[cityIndex].current;
        return {
          name,
          current,
          income: current * unitPrice
        };
      });
      const todayTotal = todayCities.reduce((sum, city) => sum + city.current, 0);
      const cumulativeTotal = cumulativeCities.reduce((sum, city) => sum + city.current, 0);

      return {
        now: date,
        liveDayIndex,
        dayIndex,
        todayCities,
        cumulativeCities,
        todayTotal,
        todayRevenue: todayTotal * unitPrice,
        cumulativeTotal,
        cumulativeRevenue: cumulativeTotal * unitPrice
      };
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function animateValue(key, element, nextValue, formatter, duration) {
      const previous = animatedValues.get(key);
      const from = previous ? previous.current : nextValue;
      const startTime = performance.now();

      if (previous && previous.frame) {
        cancelAnimationFrame(previous.frame);
      }

      const state = { current: from, frame: null };
      animatedValues.set(key, state);

      function step(now) {
        const ratio = clamp((now - startTime) / duration, 0, 1);
        const value = from + (nextValue - from) * easeOutCubic(ratio);
        state.current = value;
        element.textContent = formatter(value);

        if (ratio < 1) {
          state.frame = requestAnimationFrame(step);
        } else {
          state.current = nextValue;
          state.frame = null;
          element.textContent = formatter(nextValue);
        }
      }

      state.frame = requestAnimationFrame(step);
    }

    function createRankRow(name, rowMap) {
      const row = document.createElement("div");
      row.className = "rank-row";
      row.innerHTML = `
        <div class="rank-badge"></div>
        <div class="city-name"></div>
        <div class="city-progress-wrap">
          <div class="city-values">
            <span class="city-current"></span>
            <span class="city-income"></span>
          </div>
          <div class="progress-track">
            <div class="progress-bar"></div>
          </div>
        </div>
      `;
      rowMap.set(name, row);
      return row;
    }

    function renderRanking(cities, listElement, rowMap) {
      const sorted = [...cities].sort((a, b) => b.current - a.current);
      const leadingValue = Math.max(1, sorted[0]?.current || 0);
      const fragment = document.createDocumentFragment();

      sorted.forEach((city, index) => {
        const row = rowMap.get(city.name) || createRankRow(city.name, rowMap);
        row.classList.toggle("top", index < 3);
        row.querySelector(".rank-badge").textContent = index + 1;
        row.querySelector(".city-name").textContent = city.name;
        row.querySelector(".city-current").textContent = `${formatNumber(city.current)} 条`;
        row.querySelector(".city-income").textContent = formatCurrency(city.income);
        row.querySelector(".progress-bar").style.width = `${clamp(city.current / leadingValue, 0, 1) * 100}%`;
        fragment.appendChild(row);
      });

      listElement.appendChild(fragment);
    }

    function render() {
      const dataNow = getDisplayNow();
      const realNow = new Date();
      latestSnapshot = getSnapshot(dataNow);
      const duration = Math.max(650, Number(CONFIG.refreshSeconds || 2) * 850);
      const roundedCumulative = Math.round(latestSnapshot.cumulativeTotal);
      const roundedToday = Math.round(latestSnapshot.todayTotal);
      const cumulativeChanged = lastRenderedCumulative !== null && roundedCumulative > lastRenderedCumulative;
      const todayChanged = lastRenderedToday !== null && roundedToday > lastRenderedToday;
      const campaignStart = getCampaignStartDay();

      refs.boardTitle.textContent = CONFIG.boardTitle;
      refs.currentDate.textContent = formatCurrentDate(realNow);
      refs.currentTime.textContent = formatClock(realNow);
      refs.summaryRange.textContent = `${formatDateShort(campaignStart)} 至 ${formatDateShort(realNow)}`;
      refs.todayDate.textContent = formatDateChinese(realNow);
      refs.cumulativeRankRange.textContent = `${formatDateShort(campaignStart)} 至今`;

      animateValue("cumulativeTotal", refs.cumulativeTotal, latestSnapshot.cumulativeTotal, formatNumber, duration);
      animateValue("cumulativeRevenue", refs.cumulativeRevenue, latestSnapshot.cumulativeRevenue, formatCurrency, duration);
      animateValue("todayTotal", refs.todayTotal, latestSnapshot.todayTotal, formatNumber, duration);
      animateValue("todayRevenue", refs.todayRevenue, latestSnapshot.todayRevenue, formatCurrency, duration);

      if (cumulativeChanged) {
        [refs.cumulativeTotal, refs.cumulativeRevenue].forEach((element) => {
          element.classList.remove("pulse");
          void element.offsetWidth;
          element.classList.add("pulse");
        });
      }

      if (todayChanged) {
        [refs.todayTotal, refs.todayRevenue].forEach((element) => {
          element.classList.remove("pulse");
          void element.offsetWidth;
          element.classList.add("pulse");
        });
      }

      lastRenderedCumulative = roundedCumulative;
      lastRenderedToday = roundedToday;

      renderRanking(latestSnapshot.todayCities, refs.todayRankList, rankRows.today);
      renderRanking(latestSnapshot.cumulativeCities, refs.cumulativeRankList, rankRows.cumulative);
    }

    function updateClockOnly() {
      const now = new Date();
      refs.currentDate.textContent = formatCurrentDate(now);
      refs.currentTime.textContent = formatClock(now);
    }

    function setupTrendCanvas() {
      const canvas = refs.trendChart;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { canvas, ctx, width: rect.width, height: rect.height };
    }

    function getNiceCeiling(value) {
      const adjusted = Math.max(1, value * 1.12);
      const power = Math.pow(10, Math.floor(Math.log10(adjusted)));
      const normalized = adjusted / power;
      const multiplier = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
      return multiplier * power;
    }

    function drawTrend() {
      const { ctx, width, height } = setupTrendCanvas();
      if (!width || !height) {
        return;
      }

      const now = latestSnapshot ? latestSnapshot.now : getDisplayNow();
      const dayIndex = latestSnapshot ? latestSnapshot.dayIndex : getDataDayIndex(now);
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(CONFIG.dailyStartHour) || 8);
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(CONFIG.dailyEndHour) || 20);
      const startMs = start.getTime();
      const endMs = end.getTime();
      const span = Math.max(1, endMs - startMs);
      const visibleEndMs = clamp(now.getTime(), startMs, endMs);
      const currentTotal = latestSnapshot ? latestSnapshot.total : getTodayTotalAt(dayIndex, now);
      const maxValue = getNiceCeiling(currentTotal);
      const left = 62;
      const right = 24;
      const top = 18;
      const bottom = 38;
      const chartWidth = width - left - right;
      const chartHeight = height - top - bottom;

      ctx.clearRect(0, 0, width, height);
      ctx.font = "12px Microsoft YaHei, Arial";
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255, 229, 158, 0.16)";
      ctx.fillStyle = "rgba(255, 236, 174, 0.56)";

      for (let i = 0; i <= 4; i += 1) {
        const y = top + (chartHeight / 4) * i;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(left + chartWidth, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.fillText(formatNumber(maxValue * (1 - i / 4)), left - 10, y + 4);
      }

      for (let hour = Number(CONFIG.dailyStartHour) || 8; hour <= (Number(CONFIG.dailyEndHour) || 20); hour += 2) {
        const ratio = (hour - (Number(CONFIG.dailyStartHour) || 8)) / Math.max(1, (Number(CONFIG.dailyEndHour) || 20) - (Number(CONFIG.dailyStartHour) || 8));
        const x = left + chartWidth * ratio;
        ctx.textAlign = "center";
        ctx.fillText(`${String(hour).padStart(2, "0")}:00`, x, height - 10);
      }

      const points = [];
      const visibleRatio = clamp((visibleEndMs - startMs) / span, 0, 1);
      const steps = Math.max(1, Math.ceil(48 * visibleRatio));
      for (let index = 0; index <= steps; index += 1) {
        const ratio = visibleRatio * index / steps;
        const sample = new Date(startMs + span * ratio);
        const value = getTodayTotalAt(dayIndex, sample);
        points.push({
          x: left + chartWidth * ratio,
          y: top + chartHeight * (1 - clamp(value / maxValue, 0, 1))
        });
      }

      const fillGradient = ctx.createLinearGradient(0, top, 0, top + chartHeight);
      fillGradient.addColorStop(0, "rgba(255, 214, 102, 0.34)");
      fillGradient.addColorStop(1, "rgba(255, 94, 31, 0.02)");
      ctx.beginPath();
      points.forEach((point, index) => index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y));
      ctx.lineTo(points[points.length - 1].x, top + chartHeight);
      ctx.lineTo(left, top + chartHeight);
      ctx.closePath();
      ctx.fillStyle = fillGradient;
      ctx.fill();

      const lineGradient = ctx.createLinearGradient(left, 0, left + chartWidth, 0);
      lineGradient.addColorStop(0, "#ff6b22");
      lineGradient.addColorStop(0.55, "#ffd25f");
      lineGradient.addColorStop(1, "#fff3b0");
      ctx.beginPath();
      points.forEach((point, index) => index === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y));
      ctx.strokeStyle = lineGradient;
      ctx.lineWidth = 4;
      ctx.shadowColor = "rgba(255, 203, 82, 0.62)";
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.shadowBlur = 0;

      const marker = points[points.length - 1];
      ctx.beginPath();
      ctx.arc(marker.x, marker.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#fff2a4";
      ctx.shadowColor = "rgba(255, 218, 95, 0.9)";
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.textAlign = "left";
    }

    function setupFireworksCanvas() {
      const canvas = refs.fireworks;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return ctx;
    }

    let fireworksContext = setupFireworksCanvas();
    const particles = [];

    function spawnFirework() {
      const x = Math.random() * window.innerWidth;
      const y = 80 + Math.random() * window.innerHeight * 0.44;
      const count = 18 + Math.floor(Math.random() * 12);
      const colors = ["#fff1a8", "#ffd05c", "#ff7a2f", "#ff4040"];

      for (let i = 0; i < count; i += 1) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = 0.55 + Math.random() * 1.8;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 46 + Math.random() * 20,
          age: 0,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function animateFireworks() {
      const ctx = fireworksContext;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (particles.length < 180 && Math.random() < 0.035) {
        spawnFirework();
      }

      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.age += 1;
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += 0.018;
        const alpha = 1 - particle.age / particle.life;

        if (alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = alpha * 0.78;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(animateFireworks);
    }

    function handleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fireworksContext = setupFireworksCanvas();
      }, 120);
    }

    window.addEventListener("resize", handleResize);

    refs.boardTitle.textContent = CONFIG.boardTitle;
    render();
    setInterval(updateClockOnly, 1000);
    setInterval(render, Math.max(1, Number(CONFIG.refreshSeconds) || 2) * 1000);
    requestAnimationFrame(animateFireworks);
  </script>
</body>
</html>
